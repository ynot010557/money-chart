<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>統計圖表</title>
<!--
  LIFF 統計儀表板（ADR 0014）。第 1～2 階段：篩選列、總覽、分類占比（含下鑽）、每月趨勢、成員分布、交易明細。

  這個檔案會公開在 GitHub Pages，只能放「不是祕密」的設定：
  - LIFF_ID：LIFF app 的 ID
  - API_URL：GAS Web App 網址（https://script.google.com/macros/s/…/exec），
    不能帶 ?token=…（那是 LINE Webhook 的密鑰）
  不可以放：試算表 ID、Gemini 金鑰、Channel secret、Channel access token、WEBHOOK_TOKEN。

  網址加 ?mock=1 會用假資料顯示畫面（不登入、不呼叫 API），給開發時在電腦上看版面。
-->
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --text: #0b0b0b;
    --text-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --border: rgba(11, 11, 11, 0.10);
    --accent: #06c755;
    --accent-ink: #ffffff;
    --danger: #d03b3b;
    --chip: #f0efec;
    --other: #b5b3ab;
    --bar-dim: #b7d3f6;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
    --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --text: #f0efec;
      --text-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --border: rgba(255, 255, 255, 0.10);
      --accent: #2bd46f;
      --accent-ink: #0b0b0b;
      --danger: #e66767;
      --chip: #262624;
      --other: #5d5c57;
      --bar-dim: #184f95;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
      --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text);
    font-family: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 560px; margin: 0 auto; padding: 0 16px 32px; }

  /* 篩選列（固定在頂端） */
  .filters {
    position: sticky; top: 0; z-index: 10;
    background: var(--page);
    padding: 12px 0 8px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
  }
  .row { display: flex; gap: 8px; align-items: center; }
  .row + .row { margin-top: 8px; }
  select, input[type="date"] {
    font: inherit; font-size: 15px; color: var(--text);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 8px; min-width: 0;
  }
  select { flex: 1; }
  .seg { display: inline-flex; background: var(--chip); border-radius: 8px; padding: 2px; flex-shrink: 0; }
  .seg button, .chips button {
    font: inherit; font-size: 14px; border: none; background: transparent; color: var(--text-2);
    padding: 6px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap;
  }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 0 0 1px var(--border); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips button { background: var(--chip); }
  .chips button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .custom { display: none; gap: 6px; align-items: center; flex-wrap: wrap; }
  .custom.show { display: flex; }
  .custom input { flex: 1; }
  .btn {
    font: inherit; font-size: 14px; border: none; border-radius: 8px;
    background: var(--accent); color: var(--accent-ink); padding: 7px 12px; cursor: pointer;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .card h2 { font-size: 15px; font-weight: 600; margin: 0 0 8px; color: var(--text-2); }
  .muted { color: var(--muted); font-size: 13px; }
  .error { color: var(--danger); }
  .hero { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
  .stats { display: flex; gap: 16px; margin-top: 4px; color: var(--text-2); font-size: 14px; font-variant-numeric: tabular-nums; }
  .warn { margin-top: 8px; font-size: 13px; color: var(--text-2); }

  .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 14px; margin-bottom: 8px; }
  .crumbs button { font: inherit; border: none; background: none; color: var(--accent); padding: 2px 0; cursor: pointer; }
  .crumbs .sep { color: var(--muted); }
  .crumbs .here { color: var(--text); font-weight: 600; }

  .donut-wrap { position: relative; width: 220px; height: 220px; margin: 4px auto 12px; }
  .donut-center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; pointer-events: none; text-align: center;
  }
  .donut-center .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .rank { list-style: none; margin: 0; padding: 0; }
  .rank li {
    display: grid; grid-template-columns: 12px 1fr auto; gap: 4px 10px; align-items: center;
    padding: 10px 4px; border-top: 1px solid var(--grid);
  }
  .rank li:first-child { border-top: none; }
  .rank li.click { cursor: pointer; }
  .rank li.click:active { background: var(--chip); }
  .sw { width: 12px; height: 12px; border-radius: 3px; }
  .rank .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank .name .chev { color: var(--muted); margin-left: 4px; }
  .rank .amt { text-align: right; font-variant-numeric: tabular-nums; }
  .rank .pct { grid-column: 2 / 4; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
  .bar { flex: 1; height: 4px; background: var(--grid); border-radius: 2px; overflow: hidden; }
  .bar span { display: block; height: 100%; border-radius: 2px; }

  .trend-wrap { position: relative; height: 200px; }
  .members { list-style: none; margin: 0; padding: 0; }
  .members li { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 8px 0; border-top: 1px solid var(--grid); }
  .members li:first-child { border-top: none; }
  .members .amt { text-align: right; font-variant-numeric: tabular-nums; }
  .members .pct { grid-column: 1 / 3; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
  .unsettled { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--grid); display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }

  .txs { list-style: none; margin: 0; padding: 0; }
  .txs li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--grid); }
  .txs li:first-child { border-top: none; }
  .txs .note { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .txs .amt { text-align: right; font-variant-numeric: tabular-nums; }
  .txs .meta { color: var(--muted); font-size: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .txs .sub { text-align: right; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; background: var(--chip); color: var(--text-2); margin-left: 4px; }
  .more { width: 100%; margin-top: 8px; background: var(--chip); color: var(--text); }
  .head { display: flex; justify-content: space-between; align-items: baseline; }

  .empty { text-align: center; padding: 24px 0; color: var(--muted); }
  .skeleton { height: 16px; border-radius: 6px; background: var(--grid); margin: 8px 0; animation: pulse 1.2s infinite ease-in-out; }
  .skeleton.big { height: 36px; width: 50%; }
  .skeleton.circle { width: 180px; height: 180px; border-radius: 50%; margin: 12px auto; }
  @keyframes pulse { 50% { opacity: .5; } }
  .version { text-align: center; color: var(--muted); font-size: 12px; margin: 8px 0 24px; }
</style>
</head>
<body>
<main>
  <div id="boot" class="card" style="margin-top:16px">
    <div class="skeleton" style="width:40%"></div>
    <div class="skeleton" style="width:70%"></div>
    <div class="skeleton" style="width:55%"></div>
  </div>

  <div id="dash" hidden>
    <div class="filters">
      <div class="row">
        <select id="book" aria-label="帳本"></select>
        <div class="seg" role="group" aria-label="支出或收入">
          <button type="button" data-type="expense" aria-pressed="true">支出</button>
          <button type="button" data-type="income" aria-pressed="false">收入</button>
        </div>
      </div>
      <div class="row chips" role="group" aria-label="期間">
        <button type="button" data-period="month" aria-pressed="true">本月</button>
        <button type="button" data-period="lastMonth" aria-pressed="false">上月</button>
        <button type="button" data-period="year" aria-pressed="false">今年</button>
        <button type="button" data-period="custom" aria-pressed="false">自訂</button>
      </div>
      <div class="row custom" id="custom">
        <input type="date" id="from" aria-label="開始日">
        <span class="muted">～</span>
        <input type="date" id="to" aria-label="結束日">
        <button type="button" class="btn" id="apply">套用</button>
      </div>
    </div>

    <section class="card" id="overview" aria-live="polite"></section>
    <section class="card" id="category"></section>
    <section class="card" id="trend"></section>
    <section class="card" id="members" hidden></section>
    <section class="card" id="txlist"></section>
  </div>
</main>
<!-- 版本號：每次更新這個檔案都要改（寫死在 HTML，JS 出錯也看得到；手機上看到舊版號 = 還在用快取） -->
<footer class="version">版本 2026-11-21b 第 2 階段</footer>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
  // ===== 設定區（只放公開資訊）=====
  const CONFIG = {
    LIFF_ID: "2012731001-2Kb9XUHL",
    API_URL: "https://script.google.com/macros/s/AKfycbydOFXSiDdT5RAbLBGi97XF7U_zEtYxRRo4_FSWtsYkfHfO8mzaxpm1t_f8M1klsLiyuQ/exec"
  };
  // =================================

  const MOCK = new URLSearchParams(location.search).get("mock") === "1";
  const BOOK_KEY = "liff_last_book";
  const MAX_SLICES = 7; // 超過 7 類合併為「其他」
  const SEP = "/";      // 分類路徑分隔（與後端 STAT_CATEGORY_PATH_SEPARATOR_ 相同）

  const $ = function (id) { return document.getElementById(id); };

  const state = {
    boot: null,         // bootstrap 結果
    bookId: "",
    type: "expense",
    period: "month",
    from: "", to: "",
    category: "",       // 目前下鑽的分類路徑；空白 = 大分類
    seq: 0,             // 只採用最新一次請求的結果
    txSeq: 0,
    txOffset: 0
  };

  const TX_PAGE = 50;

  let donut = null;
  let trendChart = null;

  // ---------- 小工具 ----------

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function money(n) {
    return "NT$" + Math.round(Number(n) || 0).toLocaleString("en-US");
  }

  // localStorage／sessionStorage 可能被擋，一律包 try/catch
  function storeGet(storage, key) {
    try { return window[storage].getItem(key); } catch (e) { return null; }
  }
  function storeSet(storage, key, value) {
    try { window[storage].setItem(key, value); } catch (e) { /* 忽略 */ }
  }

  // 今天（Asia/Taipei）
  function todayParts() {
    const s = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Taipei", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
    return { y: Number(s.slice(0, 4)), m: Number(s.slice(5, 7)), d: Number(s.slice(8, 10)), text: s };
  }
  function ymd(y, m, d) {
    return y + "-" + String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0");
  }
  function lastDay(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }

  function periodRange(period) {
    const t = todayParts();
    if (period === "lastMonth") {
      const y = t.m === 1 ? t.y - 1 : t.y;
      const m = t.m === 1 ? 12 : t.m - 1;
      return { from: ymd(y, m, 1), to: ymd(y, m, lastDay(y, m)) };
    }
    if (period === "year") {
      return { from: ymd(t.y, 1, 1), to: ymd(t.y, 12, 31) };
    }
    return { from: ymd(t.y, t.m, 1), to: ymd(t.y, t.m, lastDay(t.y, t.m)) };
  }

  function rangeLabel(from, to) {
    const f = from.split("-"), t = to.split("-");
    const sameYear = f[0] === t[0];
    if (sameYear && f[1] === t[1] && f[2] === "01" && Number(t[2]) === lastDay(Number(t[0]), Number(t[1]))) {
      return f[0] + " 年 " + Number(f[1]) + " 月";
    }
    if (sameYear && f[1] === "01" && f[2] === "01" && t[1] === "12" && t[2] === "31") {
      return f[0] + " 年";
    }
    return from.replace(/-/g, "/") + " ～ " + to.replace(/-/g, "/");
  }

  function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  // 分類顏色固定：依分類樹的順序（不是金額排名），同一個分類每次都是同一色
  function categoryColor(path) {
    if (!path) return cssVar("--other");
    const parts = path.split(SEP);
    let list = (state.boot && state.boot.categories) || [];
    let index = -1;
    for (let i = 0; i < parts.length; i++) {
      const key = parts.slice(0, i + 1).join(SEP);
      index = list.findIndex(function (n) { return n.path === key; });
      if (index < 0) return cssVar("--other");
      if (i < parts.length - 1) list = list[index].children || [];
    }
    return index < 8 ? cssVar("--s" + (index + 1)) : cssVar("--other");
  }

  // ---------- API ----------

  async function callApi(action, params) {
    if (MOCK) return mockApi(action, params);
    const idToken = liff.getIDToken();
    if (!idToken) return { ok: false, error: { code: "AUTH_EXPIRED", message: "登入已過期" } };
    // 只用 GET、不加自訂 header（避免 CORS 預檢）
    const query = new URLSearchParams(Object.assign({ action: action, idToken: idToken }, params || {}));
    const res = await fetch(CONFIG.API_URL + "?" + query.toString());
    return res.json();
  }

  function handleAuthError(result) {
    const code = result && result.error && result.error.code;
    if (code !== "AUTH_EXPIRED" && code !== "AUTH_INVALID") return false;
    // 避免無限重新登入：同一個分頁只自動重來一次
    if (storeGet("sessionStorage", "liff_relogin") === "1") {
      showFatal("登入已過期，請關閉後從 LINE 重新開啟");
      return true;
    }
    storeSet("sessionStorage", "liff_relogin", "1");
    liff.logout();
    liff.login({ redirectUri: location.href });
    return true;
  }

  function showFatal(message) {
    $("dash").hidden = true;
    $("boot").hidden = false;
    $("boot").innerHTML = '<p class="error">' + escapeHtml(message) + '</p><button class="btn" onclick="location.reload()">重新載入</button>';
  }

  function statsParams() {
    const p = { bookId: state.bookId, from: state.from, to: state.to, type: state.type };
    if (state.category) p.category = state.category;
    return p;
  }

  // ---------- 畫面 ----------

  function renderLoading() {
    $("overview").innerHTML = '<div class="skeleton" style="width:30%"></div><div class="skeleton big"></div><div class="skeleton" style="width:60%"></div>';
    $("category").innerHTML = '<div class="skeleton" style="width:30%"></div><div class="skeleton circle"></div><div class="skeleton"></div><div class="skeleton"></div>';
    $("trend").innerHTML = '<div class="skeleton" style="width:40%"></div><div class="skeleton" style="height:160px"></div>';
    if (!$("members").hidden) {
      $("members").innerHTML = '<div class="skeleton" style="width:30%"></div><div class="skeleton"></div><div class="skeleton"></div>';
    }
  }

  function renderStats(data) {
    const t = data.totals;
    const label = data.type === "income" ? "總收入" : "總支出";
    const scope = data.category ? "・" + escapeHtml(data.category.label) : "";

    $("overview").innerHTML =
      "<h2>" + rangeLabel(data.range.from, data.range.to) + " " + label + scope + "</h2>" +
      '<div class="hero">' + money(t.total) + "</div>" +
      '<div class="stats">' +
        "<span>日平均 " + (t.daily_average == null ? "—" : money(t.daily_average)) + "</span>" +
        "<span>" + t.count + " 筆</span>" +
      "</div>" +
      (t.unconverted_count > 0 ? '<div class="warn">⚠️ 有 ' + t.unconverted_count + " 筆外幣還沒換算台幣，以 0 計</div>" : "");

    renderCategory(data);
    renderTrend(data);
    renderMembers(data);
  }

  // ---------- 每月趨勢 ----------

  function renderTrend(data) {
    const box = $("trend");
    const months = data.by_month || [];
    const scope = data.category ? "・" + escapeHtml(data.category.label) : "";
    box.innerHTML =
      '<div class="head"><h2>近 12 個月' + (data.type === "income" ? "收入" : "支出") + scope + '</h2><span class="muted">點長條看那個月</span></div>' +
      '<div class="trend-wrap"><canvas id="trendCanvas" role="img" aria-label="近 12 個月每月金額長條圖"></canvas></div>';

    if (trendChart) { trendChart.destroy(); trendChart = null; }
    if (typeof Chart === "undefined") return;

    // 目前期間涵蓋的月份用深色，其他月份用淺色
    const fromMonth = state.from.slice(0, 7), toMonth = state.to.slice(0, 7);
    const strong = cssVar("--s1"), dim = cssVar("--bar-dim");
    const colors = months.map(function (m) {
      return m.month >= fromMonth && m.month <= toMonth ? strong : dim;
    });

    trendChart = new Chart($("trendCanvas"), {
      type: "bar",
      data: {
        labels: months.map(function (m) { return Number(m.month.slice(5)) + "月"; }),
        datasets: [{
          data: months.map(function (m) { return m.amount; }),
          backgroundColor: colors,
          borderRadius: { topLeft: 4, topRight: 4 },
          borderSkipped: "bottom",
          maxBarThickness: 18
        }]
      },
      options: {
        maintainAspectRatio: false,
        animation: { duration: 250 },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              title: function (items) {
                const m = months[items[0].dataIndex].month;
                return m.slice(0, 4) + " 年 " + Number(m.slice(5)) + " 月";
              },
              label: function (ctx) {
                const m = months[ctx.dataIndex];
                return " " + money(m.amount) + "・" + m.count + " 筆";
              }
            }
          }
        },
        scales: {
          x: {
            grid: { display: false },
            border: { color: cssVar("--grid") },
            ticks: { color: cssVar("--muted"), font: { size: 11 }, maxRotation: 0, autoSkip: true }
          },
          y: {
            beginAtZero: true,
            grid: { color: cssVar("--grid") },
            border: { display: false },
            ticks: {
              color: cssVar("--muted"), font: { size: 11 }, maxTicksLimit: 5,
              callback: function (v) { return v >= 10000 ? (v / 10000) + "萬" : v.toLocaleString("en-US"); }
            }
          }
        },
        onClick: function (evt, elements) {
          if (!elements.length) return;
          selectMonth(months[elements[0].index].month);
        }
      }
    });
  }

  // 點某個月 → 期間切到那個月（本月、上月對應到按鈕，其他用自訂）
  function selectMonth(month) {
    const y = Number(month.slice(0, 4)), m = Number(month.slice(5, 7));
    const from = ymd(y, m, 1), to = ymd(y, m, lastDay(y, m));
    let period = "custom";
    ["month", "lastMonth"].forEach(function (p) {
      const r = periodRange(p);
      if (r.from === from && r.to === to) period = p;
    });
    state.period = period;
    state.from = from; state.to = to;
    setPressed("[data-period]", "period", period);
    $("from").value = from; $("to").value = to;
    $("custom").classList.toggle("show", period === "custom");
    window.scrollTo({ top: 0, behavior: "smooth" });
    reload();
  }

  // ---------- 誰先墊的（家庭帳本、支出：未核銷依付款人） ----------

  function renderMembers(data) {
    const box = $("members");
    if (!data.by_member) {
      box.hidden = true;
      box.innerHTML = "";
      return;
    }
    box.hidden = false;
    const total = data.unsettled_total || 0;
    const color = cssVar("--s1");
    box.innerHTML =
      '<div class="head"><h2>誰先墊的</h2><span class="muted">未核銷</span></div>' +
      (data.by_member.length === 0
        ? '<div class="empty">這段期間都核銷了</div>'
        : '<ul class="members">' + data.by_member.map(function (m) {
            const pct = total > 0 ? Math.round(m.amount / total * 1000) / 10 : 0;
            return "<li><span>" + escapeHtml(m.name) + '</span><span class="amt">' + money(m.amount) + "</span>" +
              '<span class="pct"><span class="bar"><span style="width:' + Math.min(100, pct) + "%;background:" + color + '"></span></span>' + pct + "%・" + m.count + " 筆</span></li>";
          }).join("") + "</ul>") +
      (data.unsettled_total == null ? "" :
        '<div class="unsettled"><span>未核銷合計</span><strong>' + money(data.unsettled_total) + "</strong></div>");
  }

  // ---------- 交易明細 ----------

  function txParams() {
    const p = statsParams();
    p.offset = state.txOffset;
    p.limit = TX_PAGE;
    return p;
  }

  function txRow(tx) {
    const d = tx.date.slice(5).replace("-", "/");
    let amountText = money(tx.amount);
    let sub = "";
    if (tx.currency) {
      sub = tx.currency + " " + Number(tx.original_amount || 0).toLocaleString("en-US");
      if (tx.amount_missing) amountText = "未換算";
    }
    return "<li>" +
      '<span class="note">' + escapeHtml(tx.note || tx.category) + "</span>" +
      '<span class="amt">' + amountText + "</span>" +
      '<span class="meta">' + d + "・" + escapeHtml(tx.category) + "・" + escapeHtml(tx.payer) +
        (tx.settlement_status === "未核銷" ? '<span class="tag">未核銷</span>' : "") + "</span>" +
      '<span class="sub">' + escapeHtml(sub) + "</span>" +
    "</li>";
  }

  async function loadTx(reset) {
    const box = $("txlist");
    if (reset) {
      state.txOffset = 0;
      box.innerHTML = '<h2>明細</h2><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton" style="width:70%"></div>';
    }
    const seq = ++state.txSeq;
    let result;
    try {
      result = await callApi("transactions", txParams());
    } catch (e) {
      if (seq === state.txSeq) box.insertAdjacentHTML("beforeend", '<p class="error">明細載入失敗，請稍後再試</p>');
      return;
    }
    if (seq !== state.txSeq) return;
    if (!result.ok) {
      if (handleAuthError(result)) return;
      box.innerHTML = '<h2>明細</h2><p class="error">' + escapeHtml((result.error && result.error.message) || "發生錯誤") + "</p>";
      return;
    }
    const data = result.data;
    const scope = state.category ? "・" + escapeHtml(state.category.split(SEP).join(" / ")) : "";

    if (reset) {
      box.innerHTML =
        '<div class="head"><h2>明細' + scope + '</h2><span class="muted">共 ' + data.total + " 筆</span></div>" +
        (data.total === 0 ? '<div class="empty">這段期間沒有記帳</div>' : '<ul class="txs" id="txs"></ul>');
    }
    const ul = $("txs");
    if (ul) ul.insertAdjacentHTML("beforeend", data.items.map(txRow).join(""));

    const oldBtn = $("txMore");
    if (oldBtn) oldBtn.remove();
    state.txOffset = data.offset + data.items.length;
    if (data.hasMore) {
      box.insertAdjacentHTML("beforeend", '<button type="button" class="btn more" id="txMore">載入更多（還有 ' + (data.total - state.txOffset) + " 筆）</button>");
      $("txMore").addEventListener("click", function () {
        this.disabled = true;
        this.textContent = "載入中…";
        loadTx(false);
      });
    }
  }

  function reload() {
    loadStats();
    loadTx(true);
  }

  function renderCrumbs() {
    if (!state.category) return "";
    const parts = state.category.split(SEP);
    let html = '<div class="crumbs"><button type="button" data-crumb="">全部分類</button>';
    parts.forEach(function (name, i) {
      const path = parts.slice(0, i + 1).join(SEP);
      html += '<span class="sep">›</span>';
      html += i === parts.length - 1
        ? '<span class="here">' + escapeHtml(name) + "</span>"
        : '<button type="button" data-crumb="' + escapeHtml(path) + '">' + escapeHtml(name) + "</button>";
    });
    return html + "</div>";
  }

  function renderCategory(data) {
    const box = $("category");
    const title = "<h2>分類占比</h2>" + renderCrumbs();

    if (data.totals.count === 0) {
      destroyDonut();
      box.innerHTML = title + '<div class="empty">這段期間沒有記帳</div>';
      bindCrumbs();
      return;
    }

    let rows = data.by_category.slice();

    if (rows.length === 0) {
      // 已經是最底層分類，沒有下一層
      destroyDonut();
      box.innerHTML = title + '<div class="empty">這是最細的分類了<br>共 ' + data.totals.count + " 筆、" + money(data.totals.total) + "</div>";
      bindCrumbs();
      return;
    }

    if (rows.length > MAX_SLICES + 1) {
      const rest = rows.slice(MAX_SLICES);
      rows = rows.slice(0, MAX_SLICES);
      rows.push({
        name: "其他（" + rest.length + " 類）",
        path: null, drillable: false,
        amount: rest.reduce(function (s, r) { return s + r.amount; }, 0),
        count: rest.reduce(function (s, r) { return s + r.count; }, 0),
        percent: Math.round(rest.reduce(function (s, r) { return s + r.percent; }, 0) * 10) / 10
      });
    }

    rows.forEach(function (r) { r.color = categoryColor(r.path); });

    box.innerHTML =
      title +
      '<div class="donut-wrap"><canvas id="donut" aria-label="分類占比圓餅圖" role="img"></canvas>' +
        '<div class="donut-center"><span class="muted">' + (data.category ? escapeHtml(data.category.name) : "合計") + '</span><span class="v">' + money(data.totals.total) + "</span></div></div>" +
      '<ul class="rank">' +
        rows.map(function (r, i) {
          const click = r.drillable ? " click" : "";
          return '<li class="' + click + '" data-index="' + i + '">' +
            '<span class="sw" style="background:' + r.color + '"></span>' +
            '<span class="name">' + escapeHtml(r.name) + (r.drillable ? '<span class="chev">›</span>' : "") + "</span>" +
            '<span class="amt">' + money(r.amount) + "</span>" +
            '<span class="pct"><span class="bar"><span style="width:' + Math.min(100, r.percent) + "%;background:" + r.color + '"></span></span>' + r.percent + "%・" + r.count + " 筆</span>" +
          "</li>";
        }).join("") +
      "</ul>";

    box.querySelectorAll(".rank li.click").forEach(function (li) {
      li.addEventListener("click", function () { drill(rows[Number(li.dataset.index)]); });
    });
    bindCrumbs();
    drawDonut(rows);
  }

  function bindCrumbs() {
    $("category").querySelectorAll("[data-crumb]").forEach(function (b) {
      b.addEventListener("click", function () {
        state.category = b.dataset.crumb;
        reload();
      });
    });
  }

  function destroyDonut() {
    if (donut) { donut.destroy(); donut = null; }
  }

  function drawDonut(rows) {
    destroyDonut();
    if (typeof Chart === "undefined") return; // CDN 沒載到時只顯示清單
    donut = new Chart($("donut"), {
      type: "doughnut",
      data: {
        labels: rows.map(function (r) { return r.name; }),
        datasets: [{
          data: rows.map(function (r) { return r.amount; }),
          backgroundColor: rows.map(function (r) { return r.color; }),
          borderColor: cssVar("--surface"),
          borderWidth: 2,
          hoverOffset: 4
        }]
      },
      options: {
        cutout: "64%",
        animation: { duration: 250 },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function (ctx) {
                const r = rows[ctx.dataIndex];
                return " " + money(r.amount) + "（" + r.percent + "%）";
              }
            }
          }
        },
        onClick: function (evt, elements) {
          if (!elements.length) return;
          const r = rows[elements[0].index];
          if (r.drillable) drill(r);
        }
      }
    });
  }

  function drill(row) {
    if (!row || !row.drillable || !row.path) return;
    state.category = row.path;
    reload();
  }

  // ---------- 載入 ----------

  async function loadStats(prefetched) {
    const seq = ++state.seq;
    if (!prefetched) renderLoading();
    let result;
    try {
      result = prefetched ? await prefetched : await callApi("stats", statsParams());
    } catch (e) {
      if (seq === state.seq) $("overview").innerHTML = '<p class="error">連線失敗，請稍後再試</p>';
      return;
    }
    if (seq !== state.seq) return; // 已經有更新的請求
    if (result.ok) {
      storeSet("sessionStorage", "liff_relogin", "");
      renderStats(result.data);
      return;
    }
    if (handleAuthError(result)) return;
    $("overview").innerHTML = '<p class="error">' + escapeHtml((result.error && result.error.message) || "發生錯誤") + "</p>";
    $("category").innerHTML = "";
    $("trend").innerHTML = "";
    $("members").hidden = true;
    destroyDonut();
    if (trendChart) { trendChart.destroy(); trendChart = null; }
  }

  function setPressed(selector, attr, value) {
    document.querySelectorAll(selector).forEach(function (b) {
      b.setAttribute("aria-pressed", b.dataset[attr] === value ? "true" : "false");
    });
  }

  function bindFilters() {
    $("book").addEventListener("change", function () {
      state.bookId = $("book").value;
      state.category = "";
      storeSet("localStorage", BOOK_KEY, state.bookId);
      reload();
    });

    document.querySelectorAll("[data-type]").forEach(function (b) {
      b.addEventListener("click", function () {
        if (state.type === b.dataset.type) return;
        state.type = b.dataset.type;
        state.category = "";
        setPressed("[data-type]", "type", state.type);
        reload();
      });
    });

    document.querySelectorAll("[data-period]").forEach(function (b) {
      b.addEventListener("click", function () {
        state.period = b.dataset.period;
        setPressed("[data-period]", "period", state.period);
        $("custom").classList.toggle("show", state.period === "custom");
        if (state.period === "custom") {
          $("from").value = state.from;
          $("to").value = state.to;
          return; // 按「套用」才查詢
        }
        const r = periodRange(state.period);
        state.from = r.from; state.to = r.to;
        reload();
      });
    });

    $("apply").addEventListener("click", function () {
      const f = $("from").value, t = $("to").value;
      if (!f || !t) return;
      state.from = f <= t ? f : t;
      state.to = f <= t ? t : f;
      reload();
    });

    // 手機切換深淺色時重畫（顏色從 CSS 變數讀）
    try {
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
        loadStats();
      });
    } catch (e) { /* 舊瀏覽器忽略 */ }
  }

  function setupDashboard(boot) {
    state.boot = boot;
    const books = boot.books || [];
    if (books.length === 0) {
      showFatal("目前沒有可用的帳本");
      return false;
    }
    if (!books.some(function (b) { return b.book_id === state.bookId; })) {
      state.bookId = boot.default_book_id || books[0].book_id;
    }
    $("book").innerHTML = books.map(function (b) {
      return '<option value="' + escapeHtml(b.book_id) + '">' + escapeHtml(b.book_name) + (b.book_type === "family" ? "（家庭）" : "") + "</option>";
    }).join("");
    $("book").value = state.bookId;
    $("boot").hidden = true;
    $("dash").hidden = false;
    return true;
  }

  async function main() {
    if (!MOCK) {
      try {
        await liff.init({ liffId: CONFIG.LIFF_ID });
      } catch (e) {
        showFatal("LIFF 初始化失敗，請確認從 LINE 開啟");
        return;
      }
      // 在電腦瀏覽器開啟時，先用 LINE 帳號登入
      if (!liff.isLoggedIn()) {
        liff.login({ redirectUri: location.href });
        return;
      }
    }

    const r = periodRange("month");
    state.from = r.from; state.to = r.to;
    state.bookId = storeGet("localStorage", BOOK_KEY) || "";

    // 有記住的帳本時，bootstrap 與 stats 同時送出，少等一趟
    const statsPromise = state.bookId ? callApi("stats", statsParams()) : null;

    let boot;
    try {
      boot = await callApi("bootstrap");
    } catch (e) {
      showFatal("連線失敗，請稍後再試");
      return;
    }
    if (!boot.ok) {
      if (handleAuthError(boot)) return;
      showFatal((boot.error && boot.error.message) || "發生錯誤");
      return;
    }

    const savedBook = state.bookId;
    if (!setupDashboard(boot.data)) return;
    bindFilters();
    renderLoading();

    // 記住的帳本已經沒有權限時，改用預設帳本重新查
    if (statsPromise && savedBook === state.bookId) {
      loadStats(statsPromise);
    } else {
      storeSet("localStorage", BOOK_KEY, state.bookId);
      loadStats();
    }
    loadTx(true);
  }

  // ---------- 假資料（?mock=1） ----------

  function mockApi(action, params) {
    const categories = [
      { name: "餐飲", path: "餐飲", children: [
        { name: "正餐", path: "餐飲/正餐", children: [{ name: "午餐", path: "餐飲/正餐/午餐", children: [] }, { name: "晚餐", path: "餐飲/正餐/晚餐", children: [] }] },
        { name: "飲料", path: "餐飲/飲料", children: [] }] },
      { name: "交通", path: "交通", children: [] },
      { name: "居家", path: "居家", children: [] },
      { name: "娛樂", path: "娛樂", children: [] },
      { name: "醫療", path: "醫療", children: [] },
      { name: "購物", path: "購物", children: [] },
      { name: "教育", path: "教育", children: [] },
      { name: "保險", path: "保險", children: [] },
      { name: "孝親", path: "孝親", children: [] }
    ];
    if (action === "bootstrap") {
      return Promise.resolve({ ok: true, data: {
        user: { user_id: "demo", alias: "示範" },
        books: [{ book_id: "B1", book_name: "家庭帳本", book_type: "family" }, { book_id: "B2", book_name: "我的帳本", book_type: "personal" }],
        categories: categories, default_book_id: "B2"
      } });
    }
    if (action === "transactions") {
      const notes = ["晚餐（品田牧場）", "全聯", "加油", "午餐", "飲料", "電費", "停車", "牙醫"];
      const all = [];
      for (let i = 0; i < 83; i++) {
        all.push({
          date: "2026-11-" + String(21 - (i % 21)).padStart(2, "0"),
          category: ["餐飲 / 正餐 / 晚餐", "居家 / 日用品", "交通 / 加油", "餐飲 / 正餐 / 午餐", "餐飲 / 飲料"][i % 5],
          amount: 80 + (i * 37) % 900, amount_missing: i === 5, currency: i === 5 ? "JPY" : "",
          original_amount: i === 5 ? 1200 : null,
          note: notes[i % notes.length], payer: i % 3 ? "老公" : "老婆",
          settlement_status: i % 4 ? "已核銷" : "未核銷"
        });
      }
      const off = Number(params.offset) || 0, lim = Number(params.limit) || 50;
      return new Promise(function (resolve) { setTimeout(function () { resolve({ ok: true, data: {
        items: all.slice(off, off + lim), total: all.length, offset: off, hasMore: off + lim < all.length
      } }); }, 500); });
    }
    const level = params.category ? params.category.split("/").length : 0;
    let rows;
    if (level === 0) {
      rows = [["餐飲", 8420, 41, true], ["居家", 5200, 6], ["交通", 2310, 18], ["購物", 1980, 7], ["娛樂", 1200, 4], ["醫療", 650, 2], ["教育", 500, 1], ["保險", 420, 1], ["孝親", 300, 1], [null, 180, 2]];
    } else if (level === 1) {
      rows = [["正餐", 6900, 30, true], ["飲料", 1520, 11]];
    } else if (level === 2) {
      rows = [["晚餐", 4100, 14], ["午餐", 2800, 16]];
    } else {
      rows = [];
    }
    const total = rows.reduce(function (s, r) { return s + r[1]; }, 0) || 6900;
    return new Promise(function (resolve) { setTimeout(function () { resolve({ ok: true, data: {
      book: { book_id: params.bookId }, range: { from: params.from, to: params.to }, type: params.type,
      category: params.category ? { path: params.category, name: params.category.split("/").pop(), label: params.category.split("/").join(" / ") } : null,
      totals: { total: total, count: 83, days: 21, daily_average: Math.round(total / 21), unconverted_count: 1 },
      by_month: ["2025-12", "2026-01", "2026-02", "2026-03", "2026-04", "2026-05", "2026-06", "2026-07", "2026-08", "2026-09", "2026-10", "2026-11"].map(function (m, i) {
        return { month: m, amount: Math.round(total * (0.6 + ((i * 7) % 10) / 12)), count: 40 + i };
      }),
      by_member: params.bookId === "B1" && params.type === "expense" ? [{ name: "老公", amount: 1980, count: 5 }, { name: "老婆", amount: 1140, count: 3 }] : null,
      unsettled_total: params.bookId === "B1" && params.type === "expense" ? 3120 : null,
      by_category: rows.map(function (r) {
        return { name: r[0] || "待確認", path: r[0] ? (params.category ? params.category + "/" : "") + r[0] : null, drillable: !!r[3], amount: r[1], count: r[2], percent: Math.round(r[1] / total * 1000) / 10 };
      })
    } }); }, 400); });
  }

  main();
</script>
</body>
</html>
