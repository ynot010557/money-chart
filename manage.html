<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>記帳管理</title>
<!--
  LIFF 記帳管理頁（ADR 0018、0019）：交易列表、多筆修改、單筆編輯（之後加入核銷）。
  網址參數 view 決定畫面：
    view=list（預設）           交易列表；&ids=TXN_a,TXN_b 只列這幾筆並預先勾選
    view=edit&id=TXN_…         單筆編輯
  從列表點一筆會在同一頁開編輯，按「返回」回到列表。

  這個檔案會公開在 GitHub Pages，只能放「不是祕密」的設定：
  - LIFF_ID：記帳管理頁自己的 LIFF app ID（和統計頁、日記頁不同）
  - API_URL：GAS Web App 網址（https://script.google.com/macros/s/…/exec），
    不能帶 ?token=…（那是 LINE Webhook 的密鑰）
  不可以放：試算表 ID、Gemini 金鑰、Channel secret、Channel access token、WEBHOOK_TOKEN。

  讀取用 GET（?action=…&idToken=…），寫入用 POST（?api=liff，內容是 text/plain 的 JSON），
  都不加自訂 header，避免 CORS 預檢。
  網址加 ?mock=1 會用假資料顯示畫面（不登入、不呼叫 API）。
-->
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --text: #0b0b0b;
    --text-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --border: rgba(11, 11, 11, 0.10);
    --accent: #06c755;
    --accent-ink: #ffffff;
    --accent-soft: #e7f7ee;
    --danger: #d03b3b;
    --danger-ink: #ffffff;
    --chip: #f0efec;
    --ok-bg: #e7f7ee;
    --warn-bg: #fdf1e3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --text: #f0efec;
      --text-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --border: rgba(255, 255, 255, 0.10);
      --accent: #2bd46f;
      --accent-ink: #0b0b0b;
      --accent-soft: #13301f;
      --danger: #e66767;
      --danger-ink: #0b0b0b;
      --chip: #262624;
      --ok-bg: #13301f;
      --warn-bg: #33250f;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text);
    font-family: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 560px; margin: 0 auto; padding: 0 16px 120px; }
  h1 { font-size: 18px; margin: 16px 0 12px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .muted { color: var(--muted); font-size: 13px; }
  .error { color: var(--danger); }
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field > label, .field > .label { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 4px; }
  .field .hint { font-size: 12px; color: var(--muted); margin-top: 2px; }
  input, select, textarea {
    font: inherit; font-size: 16px; color: var(--text);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0;
  }
  textarea { resize: vertical; min-height: 64px; }
  input.changed, select.changed, textarea.changed { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .cats { display: grid; grid-template-columns: 1fr; gap: 6px; }
  .seg { display: flex; gap: 6px; }
  .seg button {
    flex: 1; font: inherit; font-size: 15px; border: 1px solid var(--border); background: var(--chip); color: var(--text-2);
    padding: 8px 10px; border-radius: 8px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .btn {
    font: inherit; font-size: 16px; border: none; border-radius: 10px;
    background: var(--accent); color: var(--accent-ink); padding: 11px 16px; cursor: pointer;
  }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.plain { background: var(--chip); color: var(--text); }
  .btn.danger { background: var(--danger); color: var(--danger-ink); }
  .btn.small { font-size: 14px; padding: 7px 12px; border-radius: 8px; white-space: nowrap; flex-shrink: 0; }
  .btn.link { background: none; color: var(--danger); padding: 8px 0; font-size: 15px; }
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--page); border-top: 1px solid var(--border);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  }
  .bar .inner { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
  .bar .inner .btn { flex: 1; }
  .bar .count { flex: 1.2; font-size: 14px; color: var(--text-2); line-height: 1.3; }
  .bar .count b { color: var(--text); font-size: 15px; }
  .notice { border-radius: 10px; padding: 10px 12px; margin: 12px 0; font-size: 14px; white-space: pre-wrap; }
  .notice.ok { background: var(--ok-bg); }
  .notice.warn { background: var(--warn-bg); }
  .notice.err { background: var(--warn-bg); color: var(--danger); }
  .changes { margin: 4px 0 0; padding-left: 18px; }
  .skeleton { height: 16px; border-radius: 6px; background: var(--grid); margin: 8px 0; animation: pulse 1.2s infinite ease-in-out; }
  @keyframes pulse { 50% { opacity: .5; } }

  /* 列表篩選列（固定在頂端） */
  .filters {
    position: sticky; top: 0; z-index: 10;
    background: var(--page);
    padding: 12px 0 8px;
    border-bottom: 1px solid var(--border);
  }
  .row { display: flex; gap: 8px; align-items: center; }
  .row + .row { margin-top: 8px; }
  .row select, .row input { font-size: 15px; padding: 6px 8px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips button {
    font: inherit; font-size: 14px; border: none; background: var(--chip); color: var(--text-2);
    padding: 6px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap;
  }
  .chips button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .custom { display: none; }
  .custom.show { display: flex; }

  .summary { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 10px 2px 6px; font-size: 14px; color: var(--text-2); }
  .banner { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--accent-soft); border-radius: 10px; padding: 8px 12px; margin-top: 12px; font-size: 14px; }

  .txlist { list-style: none; margin: 0; padding: 0; }
  .tx {
    display: flex; gap: 10px; align-items: flex-start;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 12px; margin-bottom: 8px;
  }
  .tx.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .tx .check { padding: 2px 2px 0 0; }
  .tx .check input { width: 22px; height: 22px; margin: 0; accent-color: var(--accent); }
  .tx .body { flex: 1; min-width: 0; cursor: pointer; }
  .tx .top { display: flex; justify-content: space-between; gap: 8px; }
  .tx .name { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tx .amt { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }
  .tx .amt.income { color: var(--accent); }
  .tx .sub { color: var(--muted); font-size: 13px; line-height: 1.5; }
  .badge { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; background: var(--chip); color: var(--text-2); margin-left: 4px; }
  .badge.settled { background: var(--accent-soft); }
  .more { width: 100%; margin-top: 4px; }
  .empty { text-align: center; padding: 32px 0; color: var(--muted); }

  dialog {
    border: none; border-radius: 14px; padding: 18px; max-width: 420px; width: calc(100% - 32px);
    max-height: calc(100% - 48px); overflow: auto;
    background: var(--surface); color: var(--text);
  }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  dialog h2 { font-size: 17px; margin: 0 0 12px; }
  dialog .actions { display: flex; gap: 8px; margin-top: 16px; }
  dialog .actions .btn { flex: 1; }
  .version { text-align: center; color: var(--muted); font-size: 12px; margin: 8px 0 24px; }
</style>
</head>
<body>
<main>
  <div id="boot" class="card" style="margin-top:16px">
    <div class="skeleton" style="width:40%"></div>
    <div class="skeleton" style="width:70%"></div>
    <div class="skeleton" style="width:55%"></div>
  </div>

  <!-- 交易列表 -->
  <section id="listView" hidden>
    <div class="filters">
      <form class="row" id="searchForm" role="search">
        <input type="search" id="q" placeholder="搜尋備註、品項、分類" maxlength="50" enterkeyhint="search" aria-label="關鍵字">
        <button type="submit" class="btn small">搜尋</button>
      </form>
      <div class="row chips" role="group" aria-label="期間" id="periodChips">
        <button type="button" data-period="last30" aria-pressed="true">近 30 天</button>
        <button type="button" data-period="month" aria-pressed="false">本月</button>
        <button type="button" data-period="lastMonth" aria-pressed="false">上月</button>
        <button type="button" data-period="custom" aria-pressed="false">自訂</button>
      </div>
      <div class="row custom" id="custom">
        <input type="date" id="from" aria-label="開始日">
        <span class="muted">～</span>
        <input type="date" id="to" aria-label="結束日">
        <button type="button" class="btn small" id="applyCustom">套用</button>
      </div>
      <div class="row">
        <select id="filterBook" aria-label="帳本"></select>
        <select id="filterPayer" aria-label="付款人"></select>
      </div>
      <div class="row">
        <select id="filterCatMain" aria-label="大分類"></select>
        <select id="filterCatMid" aria-label="中分類"></select>
      </div>
    </div>

    <div class="banner" id="idsBanner" hidden>
      <span id="idsBannerText"></span>
      <button type="button" class="btn small plain" id="showAll">看全部交易</button>
    </div>
    <div id="listNotice"></div>
    <div class="summary">
      <span id="listSummary" aria-live="polite"></span>
      <button type="button" class="btn small plain" id="toggleAll">全選</button>
    </div>
    <ul class="txlist" id="txList"></ul>
    <button type="button" class="btn plain more" id="loadMore" hidden>載入更多</button>
  </section>

  <!-- 單筆編輯 -->
  <section id="editView" hidden>
    <h1>修改交易</h1>
    <div id="editNotice"></div>
    <form id="editForm" autocomplete="off" novalidate>
      <div class="card">
        <div class="field">
          <label for="fDate">日期</label>
          <input type="date" id="fDate" required>
        </div>
        <div class="field">
          <label for="fAmount" id="fAmountLabel">金額</label>
          <input type="text" id="fAmount" inputmode="decimal" required>
          <div class="hint" id="fAmountHint"></div>
        </div>
        <div class="field">
          <label for="fNote">備註</label>
          <textarea id="fNote" maxlength="500" rows="2"></textarea>
        </div>
      </div>
      <div class="card">
        <div class="field">
          <span class="label">分類</span>
          <div class="cats">
            <select id="fCatMain" aria-label="大分類"></select>
            <select id="fCatMid" aria-label="中分類"></select>
            <select id="fCatSub" aria-label="小分類"></select>
          </div>
          <div class="hint">只能選到最底層分類</div>
        </div>
        <div class="field">
          <label for="fBook">帳本</label>
          <select id="fBook"></select>
        </div>
        <div class="field">
          <label for="fPayer">付款人</label>
          <select id="fPayer"></select>
        </div>
        <div class="field">
          <label for="fEvent">活動</label>
          <select id="fEvent"></select>
        </div>
        <div class="field">
          <span class="label">核銷狀態</span>
          <div class="seg" role="group" aria-label="核銷狀態" id="fSettle">
            <button type="button" data-value="未核銷" aria-pressed="true">未核銷</button>
            <button type="button" data-value="已核銷" aria-pressed="false">已核銷</button>
          </div>
        </div>
      </div>
      <button type="button" class="btn link" id="deleteBtn">🗑 刪除這筆</button>
    </form>
  </section>

  <!-- 完成畫面（刪除後） -->
  <section id="doneView" hidden>
    <div class="card" style="margin-top:16px">
      <p id="doneText" style="margin:0 0 12px"></p>
      <button type="button" class="btn plain" id="doneClose" style="width:100%">關閉</button>
    </div>
  </section>
</main>

<div class="bar" id="listBar" hidden>
  <div class="inner">
    <div class="count" id="selCount"><b>已選 0 筆</b></div>
    <button type="button" class="btn plain" id="batchDeleteBtn" disabled>刪除</button>
    <button type="button" class="btn" id="batchEditBtn" disabled>批次修改</button>
  </div>
</div>

<div class="bar" id="editBar" hidden>
  <div class="inner">
    <button type="button" class="btn plain" id="closeBtn">關閉</button>
    <button type="button" class="btn" id="saveBtn" disabled>儲存</button>
  </div>
</div>

<!-- 批次修改 -->
<dialog id="batchDialog">
  <h2 id="batchTitle">批次修改</h2>
  <p class="muted" style="margin:-6px 0 12px">只會改有選的欄位，其他欄位不變；金額、備註請點單筆修改。</p>
  <div class="field">
    <label for="bBook">帳本</label>
    <select id="bBook"></select>
  </div>
  <div class="field">
    <span class="label">分類</span>
    <div class="cats">
      <select id="bCatMain" aria-label="大分類"></select>
      <select id="bCatMid" aria-label="中分類"></select>
      <select id="bCatSub" aria-label="小分類"></select>
    </div>
  </div>
  <div class="field">
    <label for="bPayer">付款人</label>
    <select id="bPayer"></select>
  </div>
  <div class="field">
    <label for="bDate">日期</label>
    <input type="date" id="bDate">
    <div class="hint">空白 = 不修改</div>
  </div>
  <div class="field">
    <label for="bEvent">活動</label>
    <select id="bEvent"></select>
  </div>
  <div class="field">
    <label for="bSettle">核銷狀態</label>
    <select id="bSettle">
      <option value="">（不修改）</option>
      <option value="未核銷">未核銷</option>
      <option value="已核銷">已核銷</option>
    </select>
  </div>
  <p class="error" id="batchError" style="margin:8px 0 0"></p>
  <div class="actions">
    <button type="button" class="btn plain" id="batchCancel">取消</button>
    <button type="button" class="btn" id="batchPreview">預覽</button>
  </div>
</dialog>

<dialog id="confirmDialog">
  <p id="confirmText" style="margin:0;white-space:pre-wrap"></p>
  <div class="actions">
    <button type="button" class="btn plain" id="confirmCancel">取消</button>
    <button type="button" class="btn danger" id="confirmOk">確定</button>
  </div>
</dialog>

<!-- 版本號：每次更新這個檔案都要改（寫死在 HTML，JS 出錯也看得到；手機上看到舊版號 = 還在用快取） -->
<footer class="version">版本 2026-11-26 記帳管理（列表、多筆修改）</footer>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  // ===== 設定區（只放公開資訊）=====
  const CONFIG = {
    LIFF_ID: "2012731001-v2KgwCNk",  // 記帳管理頁自己的 LIFF ID（和統計頁、日記頁不同）
    API_URL: "https://script.google.com/macros/s/AKfycbydOFXSiDdT5RAbLBGi97XF7U_zEtYxRRo4_FSWtsYkfHfO8mzaxpm1t_f8M1klsLiyuQ/exec"
  };
  // =================================

  const MOCK = new URLSearchParams(location.search).get("mock") === "1";
  const PAGE = 50;
  const WEEKDAYS = ["日", "一", "二", "三", "四", "五", "六"];

  const $ = function (id) { return document.getElementById(id); };

  // ---------- 小工具 ----------

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function money(n) {
    return "NT$" + Math.round(Number(n) || 0).toLocaleString("en-US");
  }

  function newRequestId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID().replace(/-/g, "");
    return String(Date.now()) + Math.random().toString(36).slice(2, 12);
  }

  function option(value, label, selected) {
    const o = document.createElement("option");
    o.value = value;
    o.textContent = label;
    if (selected) o.selected = true;
    return o;
  }

  function todayParts() {
    const s = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Taipei", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
    return { y: Number(s.slice(0, 4)), m: Number(s.slice(5, 7)), d: Number(s.slice(8, 10)), text: s };
  }
  function ymd(y, m, d) {
    return y + "-" + String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0");
  }
  function lastDay(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }

  // 空字串 = 交給伺服器用預設（近 30 天）
  function periodRange(period) {
    const t = todayParts();
    if (period === "lastMonth") {
      const y = t.m === 1 ? t.y - 1 : t.y;
      const m = t.m === 1 ? 12 : t.m - 1;
      return { from: ymd(y, m, 1), to: ymd(y, m, lastDay(y, m)) };
    }
    if (period === "month") {
      return { from: ymd(t.y, t.m, 1), to: ymd(t.y, t.m, lastDay(t.y, t.m)) };
    }
    return { from: "", to: "" };
  }

  // 2026-11-21 → 11/21（六）；不是今年時加年份
  function dateLabel(date) {
    if (!date) return "";
    const p = date.split("-").map(Number);
    const w = WEEKDAYS[new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay()];
    const md = p[1] + "/" + p[2] + "（" + w + "）";
    return p[0] === todayParts().y ? md : p[0] + "/" + md;
  }

  function amountText(tx) {
    if (tx.currency) {
      return tx.currency + " " + (tx.amount == null ? "?" : Number(tx.amount).toLocaleString("en-US"));
    }
    return money(tx.amount);
  }

  function closeLiff() {
    if (!MOCK && window.liff && liff.isInClient && liff.isInClient()) {
      liff.closeWindow();
    } else if (history.length > 1) {
      history.back();
    } else {
      window.close();
    }
  }

  // 確認視窗：回傳 Promise<boolean>
  function confirmBox(text, okLabel, danger) {
    return new Promise(function (resolve) {
      const dlg = $("confirmDialog");
      $("confirmText").textContent = text;
      $("confirmOk").textContent = okLabel || "確定";
      $("confirmOk").className = "btn" + (danger ? " danger" : "");
      function done(v) {
        $("confirmOk").onclick = null;
        $("confirmCancel").onclick = null;
        dlg.close();
        resolve(v);
      }
      $("confirmOk").onclick = function () { done(true); };
      $("confirmCancel").onclick = function () { done(false); };
      if (dlg.showModal) dlg.showModal(); else resolve(window.confirm(text));
    });
  }

  // ---------- API ----------

  async function apiGet(action, params) {
    if (MOCK) return mockApi(action, params);
    const idToken = liff.getIDToken();
    if (!idToken) return { ok: false, error: { code: "AUTH_EXPIRED", message: "登入已過期" } };
    const query = new URLSearchParams(Object.assign({ action: action, idToken: idToken }, params || {}));
    const res = await fetch(CONFIG.API_URL + "?" + query.toString());
    return res.json();
  }

  async function apiPost(action, body) {
    if (MOCK) return mockApi(action, body);
    const idToken = liff.getIDToken();
    if (!idToken) return { ok: false, error: { code: "AUTH_EXPIRED", message: "登入已過期" } };
    // 字串 body 預設是 text/plain，不會觸發 CORS 預檢
    const res = await fetch(CONFIG.API_URL + "?api=liff", {
      method: "POST",
      body: JSON.stringify(Object.assign({ action: action, idToken: idToken }, body || {}))
    });
    return res.json();
  }

  function handleAuthError(result) {
    const code = result && result.error && result.error.code;
    if (code !== "AUTH_EXPIRED" && code !== "AUTH_INVALID") return false;
    let tried = null;
    try { tried = sessionStorage.getItem("liff_relogin"); } catch (e) { /* 忽略 */ }
    if (tried === "1") {
      showFatal("登入已過期，請關閉後從 LINE 重新開啟");
      return true;
    }
    try { sessionStorage.setItem("liff_relogin", "1"); } catch (e) { /* 忽略 */ }
    liff.logout();
    liff.login({ redirectUri: location.href });
    return true;
  }

  function hideAllViews() {
    ["listView", "editView", "doneView"].forEach(function (id) { $(id).hidden = true; });
    $("listBar").hidden = true;
    $("editBar").hidden = true;
  }

  function showFatal(message) {
    hideAllViews();
    $("boot").hidden = false;
    $("boot").innerHTML = '<p class="error">' + escapeHtml(message) + '</p>' +
      '<button class="btn plain" onclick="location.reload()">重新載入</button>';
  }

  function errorMessage(result) {
    return (result && result.error && result.error.message) || "系統暫時無法處理，請稍後再試";
  }

  function noticeHtml(kind, html) {
    return html ? '<div class="notice ' + kind + '">' + html + "</div>" : "";
  }

  // ---------- 分類三層選單（編輯與批次共用）----------

  function catLeaves(categories, i, j) {
    return categories[i].mids[j].leaves;
  }

  function fillCatSelects(prefix, categories, pos, emptyLabel) {
    const main = $(prefix + "CatMain"), mid = $(prefix + "CatMid"), sub = $(prefix + "CatSub");
    main.innerHTML = "";
    main.appendChild(option("", emptyLabel, !pos));
    categories.forEach(function (c, i) { main.appendChild(option(String(i), c.name, pos && pos.main === i)); });
    fillCatMid(prefix, categories, pos ? pos.main : -1, pos ? pos.mid : -1);
    fillCatSub(prefix, categories, pos ? pos.main : -1, pos ? pos.mid : -1, pos ? pos.leaf : -1);
  }

  function fillCatMid(prefix, categories, i, selected) {
    const sel = $(prefix + "CatMid");
    sel.innerHTML = "";
    if (i < 0) { sel.hidden = true; return; }
    sel.hidden = false;
    sel.appendChild(option("", "請選擇中分類", selected < 0));
    categories[i].mids.forEach(function (m, j) { sel.appendChild(option(String(j), m.name, j === selected)); });
  }

  function fillCatSub(prefix, categories, i, j, selected) {
    const sel = $(prefix + "CatSub");
    sel.innerHTML = "";
    if (i < 0 || j < 0) { sel.hidden = true; return; }
    const leaves = catLeaves(categories, i, j);
    if (leaves.length === 1 && !leaves[0].name) { sel.hidden = true; return; }
    sel.hidden = false;
    sel.appendChild(option("", "請選擇小分類", selected < 0));
    leaves.forEach(function (l, k) { sel.appendChild(option(String(k), l.name, k === selected)); });
  }

  function bindCatSelects(prefix, getCategories, onChange) {
    $(prefix + "CatMain").addEventListener("change", function () {
      const i = this.value === "" ? -1 : Number(this.value);
      fillCatMid(prefix, getCategories(), i, -1);
      fillCatSub(prefix, getCategories(), i, -1, -1);
      onChange();
    });
    $(prefix + "CatMid").addEventListener("change", function () {
      const i = $(prefix + "CatMain").value === "" ? -1 : Number($(prefix + "CatMain").value);
      const j = this.value === "" ? -1 : Number(this.value);
      fillCatSub(prefix, getCategories(), i, j, -1);
      onChange();
    });
    $(prefix + "CatSub").addEventListener("change", onChange);
  }

  // 目前選到的最底層：{ id, path }；沒選大分類 → null；還沒選到最底層 → { id: "" }
  function selectedCategory(prefix, categories) {
    const i = $(prefix + "CatMain").value === "" ? -1 : Number($(prefix + "CatMain").value);
    if (i < 0) return null;
    const j = $(prefix + "CatMid").value === "" ? -1 : Number($(prefix + "CatMid").value);
    if (j < 0) return { id: "" };
    const leaves = catLeaves(categories, i, j);
    const names = [categories[i].name, categories[i].mids[j].name];
    if (leaves.length === 1 && !leaves[0].name) return { id: leaves[0].id, path: names.join(" / ") };
    const k = $(prefix + "CatSub").value === "" ? -1 : Number($(prefix + "CatSub").value);
    if (k < 0) return { id: "" };
    return { id: leaves[k].id, path: names.concat(leaves[k].name).join(" / ") };
  }

  function findCategory(categories, id) {
    for (let i = 0; i < categories.length; i++) {
      for (let j = 0; j < categories[i].mids.length; j++) {
        const leaves = categories[i].mids[j].leaves;
        for (let k = 0; k < leaves.length; k++) {
          if (leaves[k].id === id) return { main: i, mid: j, leaf: k };
        }
      }
    }
    return null;
  }

  function memberLabel(m) {
    return m.alias === m.user_code ? m.user_code : m.alias + "（" + m.user_code + "）";
  }

  function eventLabel(e) {
    const period = e.start_date
      ? "（" + e.start_date.slice(5).replace("-", "/") + "～" + (e.end_date ? e.end_date.slice(5).replace("-", "/") : "") + "）"
      : "";
    return e.name + period;
  }

    fromList: false   // 編輯頁是不是從列表點進去的（決定「關閉」或「返回」）
  };

  window.addEventListener("popstate", function () {
    const q = new URLSearchParams(location.search);

      nav.fromList = false;
      showList(true);

  // ---------- 交易列表 ----------

  const list = {
    options: null,
    period: "last30",
    from: "", to: "",
    keyword: "",
    ids: "",           // 聊天室「修改這幾筆」：只列這幾筆
    items: [],
    offset: 0,
    total: 0,
    seq: 0,

  function listParams() {
    const p = { offset: list.offset, limit: PAGE };
    if (list.ids) { p.ids = list.ids; return p; }
    if (list.from) { p.from = list.from; p.to = list.to; }
    if ($("filterBook").value) p.bookId = $("filterBook").value;
    if ($("filterPayer").value) p.payer = $("filterPayer").value;
    const i = $("filterCatMain").value;
    if (i !== "") {
      const main = list.options.categories[Number(i)];
      p.catMain = main.name;
      const j = $("filterCatMid").value;
      if (j !== "") p.catMid = main.mids[Number(j)].name;
    }
    if (list.keyword) p.q = list.keyword;
    return p;
  }

  function fillListFilters() {
    const opt = list.options;
    const book = $("filterBook");
    book.innerHTML = "";
    book.appendChild(option("", "全部帳本", true));
    opt.books.forEach(function (b) { book.appendChild(option(b.book_id, b.book_name)); });

    const payer = $("filterPayer");
    payer.innerHTML = "";
    payer.appendChild(option("", "全部付款人", true));
    opt.members.forEach(function (m) { payer.appendChild(option(m.user_code, memberLabel(m))); });

    const main = $("filterCatMain");
    main.innerHTML = "";
    main.appendChild(option("", "全部分類", true));
    opt.categories.forEach(function (c, i) { main.appendChild(option(String(i), c.name)); });
    fillFilterMid(-1);
  }

  function fillFilterMid(i) {
    const sel = $("filterCatMid");
    sel.innerHTML = "";
    if (i < 0) { sel.hidden = true; return; }
    sel.hidden = false;
    sel.appendChild(option("", "全部中分類", true));
    list.options.categories[i].mids.forEach(function (m, j) { sel.appendChild(option(String(j), m.name)); });
  }

  function txRow(tx) {
    const li = document.createElement("li");
    li.className = "tx" + (list.selected[tx.id] ? " selected" : "");
    li.setAttribute("data-id", tx.id);
    const name = tx.note || tx.item || tx.category_path;
    const subParts = [dateLabel(tx.date), tx.category_path];
    if (tx.payer_alias) subParts.push(tx.payer_alias + " 付");
    if (tx.book_name) subParts.push(tx.book_name); else subParts.push("帳本待選");
    let badges = "";
    if (tx.settlement_status === "已核銷") badges += '<span class="badge settled">已核銷</span>';
    if (tx.activity_name) badges += '<span class="badge">' + escapeHtml(tx.activity_name) + "</span>";
    if (tx.type === "income") badges += '<span class="badge">收入</span>';
    const twd = tx.currency ? (tx.amount_twd == null ? "未換算" : "≈ " + money(tx.amount_twd)) : "";
    li.innerHTML =
      '<label class="check"><input type="checkbox" aria-label="選取"' + (list.selected[tx.id] ? " checked" : "") + "></label>" +
      '<div class="body" role="button" tabindex="0">' +
        '<div class="top"><span class="name">' + escapeHtml(name) + "</span>" +
          '<span class="amt' + (tx.type === "income" ? " income" : "") + '">' + escapeHtml(amountText(tx)) + "</span></div>" +
        '<div class="sub">' + escapeHtml(subParts.join("・")) + badges + (twd ? "・" + escapeHtml(twd) : "") + "</div>" +
      "</div>";
    li.querySelector("input").addEventListener("change", function () {
      toggleSelect(tx, this.checked);
      li.classList.toggle("selected", this.checked);
    });
    li.querySelector(".body").addEventListener("click", function () { openEditFromList(tx.id); });
    return li;
  }

  function toggleSelect(tx, on) {
    if (on) list.selected[tx.id] = tx; else delete list.selected[tx.id];
    refreshSelection();
  }

  function selectedItems() {
    return Object.keys(list.selected).map(function (id) { return list.selected[id]; });
  }

  function refreshSelection() {
    const items = selectedItems();
    const total = items.reduce(function (s, t) { return s + (t.type === "income" ? 0 : (Number(t.amount_twd) || 0)); }, 0);
    $("selCount").innerHTML = "<b>已選 " + items.length + " 筆</b>" + (items.length ? "<br>支出 " + money(total) : "");
    $("batchEditBtn").disabled = items.length === 0;
    $("batchDeleteBtn").disabled = items.length === 0;
    const allOn = list.items.length > 0 && list.items.every(function (t) { return list.selected[t.id]; });
    $("toggleAll").textContent = allOn ? "全不選" : "全選";
  }

  function renderListSummary(data) {
    let text = "共 " + data.total + " 筆・支出 " + money(data.expense_total);
    if (data.income_total) text += "・收入 " + money(data.income_total);
    if (!list.ids && data.from) text = data.from.slice(5).replace("-", "/") + "～" + data.to.slice(5).replace("-", "/") + "　" + text;
    $("listSummary").textContent = text;
  }

  async function loadList(append) {
    const seq = ++list.seq;
    if (!append) {
      list.offset = 0;
      list.items = [];
      $("txList").innerHTML = '<li><div class="skeleton"></div><div class="skeleton" style="width:70%"></div></li>';
      $("loadMore").hidden = true;
    }
    const params = listParams();
    if (!list.options) params.withOptions = "1";
    let result;
    try {
      result = await apiGet("tx_list", params);
    } catch (e) {
      if (seq !== list.seq) return;
      $("txList").innerHTML = '<li class="empty error">網路連線失敗，請稍後再試</li>';
      return;
    }
    if (seq !== list.seq) return;
    if (!result.ok) {
      if (handleAuthError(result)) return;
      if (!list.options) { showFatal(errorMessage(result)); return; }
      $("txList").innerHTML = '<li class="empty error">' + escapeHtml(errorMessage(result)) + "</li>";
      return;
    }
    const data = result.data;
    if (data.options) {
      list.options = data.options;
      fillListFilters();
    }
    if (!append) $("txList").innerHTML = "";
    // 已勾選的項目換成最新的資料（updated_at 才是新的）
    data.items.forEach(function (tx) {
      if (list.selected[tx.id]) list.selected[tx.id] = tx;
      list.items.push(tx);
      $("txList").appendChild(txRow(tx));
    });
    // 「修改這幾筆」預先勾選的項目：伺服器沒回的（已刪除、沒有權限）拿掉
    Object.keys(list.selected).forEach(function (id) {
      if (list.selected[id].pending) delete list.selected[id];
    });
    if (list.ids) {
      $("idsBannerText").textContent = "只顯示這則訊息的 " + data.total + " 筆";
    }
    if (list.items.length === 0) {
      $("txList").innerHTML = '<li class="empty">' + (list.ids ? "這幾筆交易已經不存在了" : "這段期間沒有交易") + "</li>";
    }
    list.offset = list.items.length;
    list.total = data.total;
    $("loadMore").hidden = !data.hasMore;
    renderListSummary(data);
    refreshSelection();
    list.loaded = true;
  }

  function showList(reload) {
    hideAllViews();
    $("boot").hidden = true;
    $("listView").hidden = false;
    $("listBar").hidden = false;
    if (reload || !list.loaded) loadList(false);
  }

  function resetSelection() {
    list.selected = {};
    refreshSelection();
  }

  function setPeriod(period) {
    list.period = period;
    Array.prototype.forEach.call($("periodChips").querySelectorAll("button"), function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-period") === period ? "true" : "false");
    });
    $("custom").classList.toggle("show", period === "custom");
    if (period === "custom") return;
    const r = periodRange(period);
    list.from = r.from; list.to = r.to;
    resetSelection();
    loadList(false);
  }

  function clearIdsMode() {
    list.ids = "";
    $("idsBanner").hidden = true;
    $("searchForm").parentElement.hidden = false;
    resetSelection();
    loadList(false);
  }

  function bindList() {
    $("searchForm").addEventListener("submit", function (e) {
      e.preventDefault();
      list.keyword = $("q").value.trim();
      resetSelection();
      loadList(false);
    });
    $("periodChips").addEventListener("click", function (e) {
      const b = e.target.closest("button");
      if (b) setPeriod(b.getAttribute("data-period"));
    });
    $("applyCustom").addEventListener("click", function () {
      const f = $("from").value, t = $("to").value;
      if (!f || !t || f > t) { $("listNotice").innerHTML = noticeHtml("err", "請選開始日與結束日（開始日不能晚於結束日）"); return; }
      $("listNotice").innerHTML = "";
      list.from = f; list.to = t;
      resetSelection();
      loadList(false);
    });
    ["filterBook", "filterPayer", "filterCatMid"].forEach(function (id) {
      $(id).addEventListener("change", function () { resetSelection(); loadList(false); });
    });
    $("filterCatMain").addEventListener("change", function () {
      fillFilterMid(this.value === "" ? -1 : Number(this.value));
      resetSelection();
      loadList(false);
    });
    $("loadMore").addEventListener("click", function () { loadList(true); });
    $("toggleAll").addEventListener("click", function () {
      const allOn = list.items.length > 0 && list.items.every(function (t) { return list.selected[t.id]; });
      list.items.forEach(function (t) { if (allOn) delete list.selected[t.id]; else list.selected[t.id] = t; });
      Array.prototype.forEach.call($("txList").querySelectorAll(".tx"), function (li) {
        li.classList.toggle("selected", !allOn);
        li.querySelector("input").checked = !allOn;
      });
      refreshSelection();
    });
    $("showAll").addEventListener("click", clearIdsMode);
    $("batchEditBtn").addEventListener("click", openBatchDialog);
    $("batchDeleteBtn").addEventListener("click", batchDelete);
    $("batchCancel").addEventListener("click", function () { $("batchDialog").close(); });
    $("batchPreview").addEventListener("click", batchPreviewAndSave);
    bindCatSelects("b", function () { return list.options.categories; }, function () {});
  }

  // ---------- 批次修改 ----------

  function openBatchDialog() {
    const opt = list.options;
    const n = selectedItems().length;
    $("batchTitle").textContent = "批次修改 " + n + " 筆";
    $("batchError").textContent = "";

    const book = $("bBook");
    book.innerHTML = "";
    book.appendChild(option("", "（不修改）", true));
    opt.books.forEach(function (b) { book.appendChild(option(b.book_id, b.book_name)); });

    fillCatSelects("b", opt.categories, null, "（不修改）");

    const payer = $("bPayer");
    payer.innerHTML = "";
    payer.appendChild(option("", "（不修改）", true));
    opt.members.forEach(function (m) { payer.appendChild(option(m.user_code, memberLabel(m))); });

    $("bDate").value = "";

    const ev = $("bEvent");
    ev.innerHTML = "";
    ev.appendChild(option("", "（不修改）", true));
    ev.appendChild(option("__NONE__", "不屬於活動"));
    opt.events.forEach(function (e) { ev.appendChild(option(e.event_id, eventLabel(e))); });

    $("bSettle").value = "";
    $("batchDialog").showModal();
  }

  // 收集批次修改的欄位與預覽文字
  function collectBatch() {
    const opt = list.options;
    const changes = {};
    const lines = [];
    const n = selectedItems().length;

    const book = $("bBook").value;
    if (book) {
      changes.book_id = book;
      const b = opt.books.find(function (x) { return x.book_id === book; });
      lines.push(n + " 筆的帳本將改為：" + (b ? b.book_name : book));
    }
    const cat = selectedCategory("b", opt.categories);
    if (cat) {
      if (!cat.id) return { error: "分類要選到最底層" };
      changes.category_id = cat.id;
      lines.push(n + " 筆的分類將改為：" + cat.path);
    }
    const payer = $("bPayer").value;
    if (payer) {
      changes.payer = payer;
      const m = opt.members.find(function (x) { return x.user_code === payer; });
      lines.push(n + " 筆的付款人將改為：" + (m ? memberLabel(m) : payer));
    }
    const date = $("bDate").value;
    if (date) {
      changes.date = date;
      lines.push(n + " 筆的日期將改為：" + date);
    }
    const ev = $("bEvent").value;
    if (ev) {
      changes.activity_id = ev === "__NONE__" ? "" : ev;
      const e = opt.events.find(function (x) { return x.event_id === ev; });
      lines.push(n + " 筆" + (ev === "__NONE__" ? "將改為不屬於活動" : "的活動將改為：" + (e ? e.name : ev)));
    }
    const settle = $("bSettle").value;
    if (settle) {
      changes.settlement_status = settle;
      lines.push(n + " 筆的核銷狀態將改為：" + settle);
    }
    if (lines.length === 0) return { error: "請至少選一個要修改的欄位" };
    return { changes: changes, lines: lines };
  }

  async function batchPreviewAndSave() {
    const batch = collectBatch();
    if (batch.error) { $("batchError").textContent = batch.error; return; }
    $("batchDialog").close();
    const ok = await confirmBox("確定要修改嗎？\n\n" + batch.lines.join("\n"), "確定修改");
    if (!ok) return;
    const items = selectedItems();
    $("batchEditBtn").disabled = true;
    $("listNotice").innerHTML = noticeHtml("ok", "儲存中…");
    try {
      const result = await apiPost("tx_batch_update", {
        items: items.map(function (t) { return { id: t.id, expected_updated_at: t.updated_at }; }),
        changes: batch.changes,
        request_id: newRequestId()
      });
      if (!result.ok) {
        if (handleAuthError(result)) return;
        if (result.error.code === "CONFLICT") {
          const n = (result.error.conflicts || []).length;
          $("listNotice").innerHTML = noticeHtml("warn", escapeHtml("有 " + (n || "部分") + " 筆剛被修改過，這次沒有修改任何一筆。已重新載入列表，請確認後再試一次。"));
          loadList(false);
        } else {
          $("listNotice").innerHTML = noticeHtml("err", escapeHtml(errorMessage(result) + "（這次沒有修改任何一筆）"));
        }
        refreshSelection();
        return;
      }
      $("listNotice").innerHTML = noticeHtml("ok", escapeHtml("✅ 已修改 " + result.data.updated + " 筆" +
        (result.data.updated < items.length ? "（其他 " + (items.length - result.data.updated) + " 筆本來就是這個值）" : "")));
      resetSelection();
      loadList(false);
    } catch (e) {
      $("listNotice").innerHTML = noticeHtml("err", "網路連線失敗，請重新載入確認是否已修改");
      refreshSelection();
    }
  }

  async function batchDelete() {
    const items = selectedItems();
    if (items.length === 0) return;
    const total = items.reduce(function (s, t) { return s + (Number(t.amount_twd) || 0); }, 0);
    const ok = await confirmBox("確定要刪除 " + items.length + " 筆嗎？\n合計 " + money(total) + "\n\n刪除後無法復原。", "刪除 " + items.length + " 筆", true);
    if (!ok) return;
    $("listNotice").innerHTML = noticeHtml("ok", "刪除中…");
    try {
      const result = await apiPost("tx_batch_delete", {
        items: items.map(function (t) { return { id: t.id, expected_updated_at: t.updated_at }; }),
        request_id: newRequestId()
      });
      if (!result.ok) {
        if (handleAuthError(result)) return;
        $("listNotice").innerHTML = noticeHtml(result.error.code === "CONFLICT" ? "warn" : "err",
          escapeHtml(errorMessage(result) + "（這次沒有刪除任何一筆）"));
        if (result.error.code === "CONFLICT") loadList(false);
        return;
      }
      $("listNotice").innerHTML = noticeHtml("ok", escapeHtml("🗑 已刪除 " + result.data.deleted + " 筆"));
      resetSelection();
      loadList(false);
    } catch (e) {
      $("listNotice").innerHTML = noticeHtml("err", "網路連線失敗，請重新載入確認是否已刪除");
    }
  }

  // ---------- 單筆編輯 ----------

  const edit = {
    tx: null,        // 伺服器上的目前值
    options: null,
    settle: "未核銷",
    saving: false
  };

  function setSettle(value) {
    edit.settle = value;
    Array.prototype.forEach.call($("fSettle").querySelectorAll("button"), function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-value") === value ? "true" : "false");
    });
  }

  function renderEdit() {
    const tx = edit.tx;
    const opt = edit.options;

    $("fDate").value = tx.date;

    $("fAmountLabel").textContent = tx.currency ? "金額（" + tx.currency + "）" : "金額";
    $("fAmount").value = tx.amount == null ? "" : String(tx.amount);
    $("fAmountHint").textContent =
      tx.currency
        ? (tx.amount_twd == null ? "尚未換算台幣" : "約 " + money(tx.amount_twd) + "（修改後依這筆的匯率重算）")
        : (tx.type === "income" ? "收入" : "");

    $("fNote").value = tx.note;

    fillCatSelects("f", opt.categories, tx.category_id ? findCategory(opt.categories, tx.category_id) : null, "請選擇大分類");

    const book = $("fBook");
    book.innerHTML = "";
    if (!tx.book_id) book.appendChild(option("", "（待選）請選擇帳本", true));
    let bookFound = false;
    opt.books.forEach(function (b) {
      if (b.book_id === tx.book_id) bookFound = true;
      book.appendChild(option(b.book_id, b.book_name, b.book_id === tx.book_id));
    });
    if (tx.book_id && !bookFound) book.appendChild(option(tx.book_id, tx.book_name || tx.book_id, true));

    const payer = $("fPayer");
    payer.innerHTML = "";
    if (!tx.payer) payer.appendChild(option("", "（未指定）", true));
    let payerFound = false;
    opt.members.forEach(function (m) {
      if (m.user_code === tx.payer) payerFound = true;
      payer.appendChild(option(m.user_code, memberLabel(m), m.user_code === tx.payer));
    });
    if (tx.payer && !payerFound) payer.appendChild(option(tx.payer, tx.payer, true));

    const ev = $("fEvent");
    ev.innerHTML = "";
    ev.appendChild(option("", "不屬於活動", !tx.activity_id));
    opt.events.forEach(function (e) {
      ev.appendChild(option(e.event_id, eventLabel(e), e.event_id === tx.activity_id));
    });

    setSettle(tx.settlement_status);
    refreshDirty();
  }

  // 只收集和伺服器目前值不同的欄位
  function collectChanges() {
    const tx = edit.tx;
    const changes = {};

    const date = $("fDate").value;
    if (date && date !== tx.date) changes.date = date;

    const amountText = $("fAmount").value.replace(/[,\s]/g, "");
    if (amountText !== "" && Number(amountText) !== tx.amount) changes.amount = Number(amountText);

    const note = $("fNote").value.trim();
    if (note !== tx.note) changes.note = note;

    const cat = selectedCategory("f", edit.options.categories);
    if (cat && cat.id && cat.id !== tx.category_id) changes.category_id = cat.id;

    const book = $("fBook").value;
    if (book && book !== tx.book_id) changes.book_id = book;

    const payer = $("fPayer").value;
    if (payer && payer !== tx.payer) changes.payer = payer;

    const ev = $("fEvent").value;
    if (ev !== tx.activity_id) changes.activity_id = ev;

    if (edit.settle !== tx.settlement_status) changes.settlement_status = edit.settle;

    return changes;
  }

  function validateEdit() {
    const amountText = $("fAmount").value.replace(/[,\s]/g, "");
    if (!/^\d+(\.\d+)?$/.test(amountText) || Number(amountText) <= 0) return "金額要是大於 0 的數字";
    if (!$("fDate").value) return "請選日期";
    const cat = selectedCategory("f", edit.options.categories);
    if (cat && !cat.id) return "分類要選到最底層";
    return "";
  }

  function refreshDirty() {
    const changes = collectChanges();
    const map = { date: "fDate", amount: "fAmount", note: "fNote", book_id: "fBook", payer: "fPayer", activity_id: "fEvent" };
    Object.keys(map).forEach(function (k) { $(map[k]).classList.toggle("changed", k in changes); });
    ["fCatMain", "fCatMid", "fCatSub"].forEach(function (id) { $(id).classList.toggle("changed", "category_id" in changes); });
    $("saveBtn").disabled = edit.saving || Object.keys(changes).length === 0;
  }

  function showEditNotice(kind, html) {
    $("editNotice").innerHTML = noticeHtml(kind, html);
    if (html) window.scrollTo({ top: 0, behavior: "smooth" });
  }

  async function showEdit(id) {
    hideAllViews();
    $("boot").hidden = false;
    $("boot").innerHTML = '<div class="skeleton" style="width:40%"></div><div class="skeleton" style="width:70%"></div>';
    $("editNotice").innerHTML = "";
    $("closeBtn").textContent = nav.fromList ? "返回列表" : "關閉";
    $("doneClose").textContent = nav.fromList ? "返回列表" : "關閉";
    let result;
    try {
      result = await apiGet("tx_get", { id: id });
    } catch (e) {
      showFatal("網路連線失敗，請稍後再試");
      return;
    }
    if (!result.ok) {
      if (handleAuthError(result)) return;
      showFatal(errorMessage(result));
      return;
    }
    edit.tx = result.data.tx;
    edit.options = result.data.options;
    $("boot").hidden = true;
    $("editView").hidden = false;
    $("editBar").hidden = false;
    window.scrollTo(0, 0);
    renderEdit();
  }

  async function saveEdit() {
    const err = validateEdit();
    if (err) { showEditNotice("err", escapeHtml(err)); return; }
    const changes = collectChanges();
    if (Object.keys(changes).length === 0) return;

    edit.saving = true;
    $("saveBtn").disabled = true;
    $("saveBtn").textContent = "儲存中…";
    try {
      const result = await apiPost("tx_update", {
        id: edit.tx.id,
        expected_updated_at: edit.tx.updated_at,
        changes: changes,
        request_id: newRequestId()
      });
      if (!result.ok) {
        if (handleAuthError(result)) return;
        if (result.error.code === "CONFLICT") {
          showEditNotice("warn", escapeHtml(errorMessage(result)) +
            '<br><button type="button" class="btn small plain" style="margin-top:8px" id="reloadEdit">重新載入</button>');
          $("reloadEdit").onclick = function () { showEdit(edit.tx.id); };
        } else {
          showEditNotice("err", escapeHtml(errorMessage(result)));
        }
        return;
      }
      edit.tx = result.data.tx;
      const changed = result.data.changed || [];
      showEditNotice("ok", "✅ 已儲存" + (changed.length
        ? '<ul class="changes">' + changed.map(function (c) {
            return "<li>" + escapeHtml(c.label) + "：" + escapeHtml(c.before || "（空白）") + " → " + escapeHtml(c.after || "（空白）") + "</li>";
          }).join("") + "</ul>"
        : "（內容沒有變動）"));
      list.loaded = false;   // 回到列表時重新載入
      renderEdit();
    } catch (e) {
      showEditNotice("err", "網路連線失敗，請稍後再試（這次可能沒有儲存）");
    } finally {
      edit.saving = false;
      $("saveBtn").textContent = "儲存";
      refreshDirty();
    }
  }

  async function deleteEdit() {
    const tx = edit.tx;
    const ok = await confirmBox(
      "確定要刪除這筆嗎？刪除後無法復原。\n\n" +
      tx.date + "　" + (tx.note || tx.category_path) + "　" + amountText(tx),
      "刪除", true
    );
    if (!ok) return;
    try {
      const result = await apiPost("tx_delete", {
        id: tx.id,
        expected_updated_at: tx.updated_at,
        request_id: newRequestId()
      });
      if (!result.ok) {
        if (handleAuthError(result)) return;
        showEditNotice(result.error.code === "CONFLICT" ? "warn" : "err", escapeHtml(errorMessage(result)));
        return;
      }
      delete list.selected[tx.id];
      list.loaded = false;
      hideAllViews();
      $("doneText").textContent = "🗑 已刪除這筆交易。";
      $("doneView").hidden = false;
    } catch (e) {
      showEditNotice("err", "網路連線失敗，請稍後再試");
    }
  }

  function bindEdit() {
    ["fDate", "fAmount", "fNote", "fBook", "fPayer", "fEvent"].forEach(function (id) {
      $(id).addEventListener("input", refreshDirty);
      $(id).addEventListener("change", refreshDirty);
    });
    bindCatSelects("f", function () { return edit.options.categories; }, refreshDirty);
    $("fSettle").addEventListener("click", function (e) {
      const b = e.target.closest("button");
      if (!b) return;
      setSettle(b.getAttribute("data-value"));
      refreshDirty();
    });
    $("editForm").addEventListener("submit", function (e) { e.preventDefault(); saveEdit(); });
    $("saveBtn").addEventListener("click", saveEdit);
    $("closeBtn").addEventListener("click", backToList);
    $("deleteBtn").addEventListener("click", deleteEdit);
    $("doneClose").addEventListener("click", backToList);
  }

  // ---------- 假資料（?mock=1）----------

  const MOCK_OPTIONS = {
    books: [{ book_id: "B1", book_name: "家庭", book_type: "family" }, { book_id: "B2", book_name: "soso 個人", book_type: "personal" }],
    members: [{ user_code: "soso", alias: "老公" }, { user_code: "twotwo", alias: "老婆" }],
    categories: [
      { name: "餐飲", mids: [{ name: "正餐", leaves: [{ name: "早餐", id: "C1" }, { name: "午餐", id: "C2" }, { name: "晚餐", id: "C3" }] },
                             { name: "飲料", leaves: [{ name: "", id: "C4" }] }] },
      { name: "交通", mids: [{ name: "大眾運輸", leaves: [{ name: "捷運", id: "C5" }, { name: "公車", id: "C6" }] },
                             { name: "計程車", leaves: [{ name: "", id: "C7" }] }] }
    ],
    events: [{ event_id: "EV1", name: "日本旅行", start_date: "2026-11-20", end_date: "2026-11-27", status: "active" }]
  };

  const MOCK_TXS = [
    { id: "TXN_1", date: "2026-11-25", type: "expense", book_id: "B1", book_name: "家庭", category_id: "C2", category_path: "餐飲 / 正餐 / 午餐", currency: "", amount: 120, amount_twd: 120, payer: "soso", payer_alias: "老公", note: "[鼎泰豐] 午餐", item: "午餐", activity_id: "", activity_name: "", settlement_status: "未核銷", updated_at: "a" },
    { id: "TXN_2", date: "2026-11-24", type: "expense", book_id: "B1", book_name: "家庭", category_id: "C5", category_path: "交通 / 大眾運輸 / 捷運", currency: "", amount: 35, amount_twd: 35, payer: "twotwo", payer_alias: "老婆", note: "捷運", item: "捷運", activity_id: "", activity_name: "", settlement_status: "已核銷", updated_at: "b" },
    { id: "TXN_3", date: "2026-11-22", type: "expense", book_id: "B1", book_name: "家庭", category_id: "C3", category_path: "餐飲 / 正餐 / 晚餐", currency: "JPY", amount: 1200, amount_twd: 252, payer: "soso", payer_alias: "老公", note: "拉麵", item: "拉麵", activity_id: "EV1", activity_name: "日本旅行", settlement_status: "未核銷", updated_at: "c" },
    { id: "TXN_4", date: "2026-11-20", type: "income", book_id: "B2", book_name: "soso 個人", category_id: "C1", category_path: "餐飲 / 正餐 / 早餐", currency: "", amount: 500, amount_twd: 500, payer: "soso", payer_alias: "老公", note: "退款", item: "退款", activity_id: "", activity_name: "", settlement_status: "未核銷", updated_at: "d" }
  ];

  function mockApi(action, params) {
    return new Promise(function (resolve) {
      setTimeout(function () {
        if (action === "tx_list") {
          let items = MOCK_TXS.slice();
          if (params.ids) items = items.filter(function (t) { return params.ids.split(",").indexOf(t.id) >= 0; });
          if (params.bookId) items = items.filter(function (t) { return t.book_id === params.bookId; });
          if (params.q) items = items.filter(function (t) { return (t.note + t.category_path).indexOf(params.q) >= 0; });
          const data = {
            items: items, total: items.length, hasMore: false,
            expense_total: items.filter(function (t) { return t.type !== "income"; }).reduce(function (s, t) { return s + t.amount_twd; }, 0),
            income_total: items.filter(function (t) { return t.type === "income"; }).reduce(function (s, t) { return s + t.amount_twd; }, 0),
            from: params.ids ? "" : (params.from || "2026-10-28"), to: params.ids ? "" : (params.to || "2026-11-26")
          };
          if (params.withOptions) data.options = MOCK_OPTIONS;
          resolve({ ok: true, data: data });
          return;
        }
        if (action === "tx_get") {
          const tx = MOCK_TXS.find(function (t) { return t.id === params.id; }) || MOCK_TXS[0];
          resolve({ ok: true, data: { tx: Object.assign({}, tx), options: MOCK_OPTIONS } });
          return;
        }
        if (action === "tx_update") {
          const tx = Object.assign({}, edit.tx, params.changes, { updated_at: String(Date.now()) });
          resolve({ ok: true, data: { tx: tx, changed: Object.keys(params.changes).map(function (k) {
            return { label: k, before: String(edit.tx[k]), after: String(params.changes[k]) };
          }) } });
          return;
        }
        if (action === "tx_batch_update") { resolve({ ok: true, data: { updated: params.items.length, items: [] } }); return; }
        if (action === "tx_delete" || action === "tx_batch_delete") {
          resolve({ ok: true, data: { deleted: params.items ? params.items.length : 1 } });
          return;
        }
        resolve({ ok: false, error: { code: "BAD_PARAMS", message: "參數不正確" } });
      }, 250);
    });
  }

  // ---------- 啟動 ----------

  async function start() {
    bindList();
    bindEdit();
    try {
      if (!MOCK) {
        if (!CONFIG.LIFF_ID) { showFatal("頁面還沒設定 LIFF ID"); return; }
        await liff.init({ liffId: CONFIG.LIFF_ID });
        if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
      }
      try { sessionStorage.removeItem("liff_relogin"); } catch (e) { /* 忽略 */ }

      // LIFF 會把額外的參數放在 liff.state，init 之後網址才是完整的
      const q = new URLSearchParams(location.search);
      const view = q.get("view") || "list";

      if (view === "edit") {
        const id = q.get("id") || (MOCK ? "TXN_1" : "");
        if (!id) { showFatal("缺少要修改的交易"); return; }
        nav.fromList = false;
        await showEdit(id);
        return;
      }

      if (view === "list") {
        const ids = (q.get("ids") || "").trim();
        if (ids) {
          list.ids = ids;
          const n = ids.split(",").filter(Boolean).length;
          $("idsBannerText").textContent = "只顯示這則訊息的 " + n + " 筆（已全部勾選）";
          $("idsBanner").hidden = false;
          $("searchForm").parentElement.hidden = true;   // 篩選列先收起來
          ids.split(",").filter(Boolean).forEach(function (id) { list.selected[id] = { id: id, pending: true }; });
        }
        showList(true);
        return;
      }

      showFatal("這個功能還在準備中");
    } catch (e) {
      showFatal("頁面載入失敗，請關閉後重新開啟");
    }
  }

  start();
</script>
